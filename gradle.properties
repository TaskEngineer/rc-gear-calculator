# Gradle JVM オプション
# Hilt + KSP + Room を併用するとデフォルト(512m)ではメモリ不足になりやすいので拡張
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Gradle のキャッシュとパラレル実行を有効化（ビルド高速化）
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# AndroidX を使用
android.useAndroidX=true

# Kotlin 公式コードスタイル
kotlin.code.style=official

# 各モジュール独自の R クラスを生成（推奨）
android.nonTransitiveRClass=true

# 注意: org.gradle.java.home はここに書かない（BUG-5 / S-2）。
# 開発機固有の絶対パスをコミットすると他の環境と CI で即失敗するため。
# 使用 JDK は JAVA_HOME か、各開発者の ~/.gradle/gradle.properties で指定する。
# ビルド手順は AGENTS.md §2 を参照。
